name: Tests
on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md', '**/*.png']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        description: 'A GHCR image (with digest) to test instead of building one; the release workflow passes the one it is about to ship'
        type: string
        default: ''
permissions:
  contents: read
  packages: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Jobs in parallel: the Python suite with coverage, the dashboard tests (own database, no coverage), the image with the Compose stack and the upgrade rehearsal.
  # The browser tests are their own workflow, browser.yml, which also runs on every push and is required for a release.
  pytest:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17.11-ts2.31.0
        env:
          POSTGRES_DB: garmin
          POSTGRES_PASSWORD: test-only-password
          NO_TS_TUNE: "true"
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d garmin"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: garmin
      PGUSER: postgres
      PGPASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # The persona and contract tests check dashboard SQL, not Python branches: the coverage gate holds without them, and tracing
      # them costs about half again as much time. Run together, they load the personas once.
      - run: uv run --locked pytest --cov --cov-report=term-missing --durations=15 --ignore=tests/test_personas.py --ignore=tests/test_dashboard_contracts.py
      # The FIT store package has its own suite, coverage gate and conformance corpus (invoked separately: both have a conftest.py).
      - run: uv run --locked --package garmin-fit-store --directory packages/garmin-fit-store pytest --cov --cov-report=term-missing
  fit-ts:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # The TypeScript codec is accepted against the Python package's committed conformance corpus (no dependencies).
      - run: node --test packages/garmin-fit-store-ts/test/*.test.ts
  dashboards:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17.11-ts2.31.0
        env:
          POSTGRES_DB: garmin
          POSTGRES_PASSWORD: test-only-password
          NO_TS_TUNE: "true"
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d garmin"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: garmin
      PGUSER: postgres
      PGPASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # The persona and contract tests check dashboard SQL, not Python branches: the coverage gate holds without them, and tracing
      # them costs about half again as much time. Run together, they load the personas once.
      - run: uv run --locked pytest --durations=5 tests/test_personas.py tests/test_dashboard_contracts.py
      - run: uv run --locked python scripts/validate_dashboard_queries.py
  stack:
    runs-on: ubuntu-26.04
    env:
      PGDATABASE: garmin
      PGUSER: garmin
      PGPASSWORD: test-only-password
      GRAFANA_PASSWORD: test-admin-password
      GRAFANA_DB_PASSWORD: test-reader-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: docker compose -f compose-example.yml --profile kiosk config --quiet
      - uses: ./.github/actions/runtime-image
        with:
          image: ${{ inputs.image }}
          token: ${{ secrets.GITHUB_TOKEN }}
          cache-to: 'true'
      - name: Verify Grafana provisioning and queries
        run: |
          docker compose -f compose-example.yml --profile kiosk up -d --no-build --wait postgres migrate grafana grafana-kiosk kiosk
          export PGHOST=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose -f compose-example.yml ps -q postgres)")
          uv run --locked python scripts/load_personas.py
          GRAFANA_URL=http://localhost:3000 KIOSK_URL=http://localhost:3001 GRAFANA_ALLOW_WRITES=1 \
            uv run --locked pytest -m grafana tests/test_grafana_stack.py --durations=5
  # The upgrade rehearsal builds nothing of its own besides the image, so it runs beside the stack checks instead of after them.
  upgrade:
    runs-on: ubuntu-26.04
    env:
      PGDATABASE: garmin
      PGUSER: garmin
      PGPASSWORD: test-only-password
      GRAFANA_PASSWORD: test-admin-password
      GRAFANA_DB_PASSWORD: test-reader-password
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runtime-image
        with:
          image: ${{ inputs.image }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rehearse the upgrade from the Alpine image
        run: scripts/smoke_upgrade.sh
