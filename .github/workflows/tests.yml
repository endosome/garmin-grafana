name: Tests
on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md', '**/*.png']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Two jobs in parallel: the Python suite, and the image with the Compose stack. Neither needs the other's result.
  pytest:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17.11-ts2.31.0
        env:
          POSTGRES_DB: garmin
          POSTGRES_PASSWORD: test-only-password
          NO_TS_TUNE: "true"
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d garmin"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: garmin
      PGUSER: postgres
      PGPASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # The persona tests check dashboard SQL, not Python branches: the coverage gate holds without them, and tracing them
      # costs about half again as much time.
      - run: uv run --locked pytest --cov --cov-report=term-missing --durations=15 --ignore=tests/test_personas.py
      - run: uv run --locked pytest --durations=5 tests/test_personas.py
      - run: uv run --locked python scripts/validate_dashboard_queries.py
  stack:
    runs-on: ubuntu-26.04
    env:
      PGDATABASE: garmin
      PGUSER: garmin
      PGPASSWORD: test-only-password
      GRAFANA_PASSWORD: test-admin-password
      GRAFANA_DB_PASSWORD: test-reader-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: docker compose -f compose-example.yml --profile kiosk config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: garmin-grafana:timescale
          cache-from: type=gha,scope=stack
          cache-to: type=gha,scope=stack,mode=max
      - name: Verify Grafana provisioning and queries
        run: |
          docker compose -f compose-example.yml --profile kiosk up -d --no-build --wait postgres migrate grafana grafana-kiosk kiosk
          export PGHOST=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose -f compose-example.yml ps -q postgres)")
          uv run --locked python scripts/load_personas.py
          GRAFANA_URL=http://localhost:3000 KIOSK_URL=http://localhost:3001 GRAFANA_ALLOW_WRITES=1 \
            uv run --locked pytest -m grafana tests/test_grafana_stack.py --durations=5
      - name: Rehearse the upgrade from the Alpine image
        run: scripts/smoke_upgrade.sh
  # Browser tests of the dashboards (docs/dashboard-testing-plan.md, layer L4). Needs the stack job first so the image comes from its layer cache.
  e2e:
    needs: stack
    runs-on: ubuntu-26.04
    env:
      PGDATABASE: garmin
      PGUSER: garmin
      PGPASSWORD: test-only-password
      GRAFANA_PASSWORD: test-admin-password
      GRAFANA_DB_PASSWORD: test-reader-password
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: docker/setup-buildx-action@v4
      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: garmin-grafana:timescale
          cache-from: type=gha,scope=stack
      - name: Start the stack with the personas
        run: |
          docker compose -f compose-example.yml --profile kiosk up -d --no-build --wait postgres migrate grafana grafana-kiosk kiosk
          export PGHOST=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose -f compose-example.yml ps -q postgres)")
          uv run --locked python scripts/load_personas.py
      - name: Browser tests
        env:
          GRAFANA_URL: http://localhost:3000
          KIOSK_URL: http://localhost:3001
          GRAFANA_ALLOW_WRITES: "1"
          CI: "true"
        run: e2e/run.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
