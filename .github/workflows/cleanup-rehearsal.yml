name: Cleanup rehearsal
on: workflow_dispatch
permissions:
  packages: write
jobs:
  delete:
    runs-on: ubuntu-26.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api=/users/${{ github.repository_owner }}/packages/container/garmin-fetch-data/versions
          gh api --paginate "$api" --jq '.[]|select(.metadata.container.tags|index("v0.0.0-ci-rehearsal-2"))|.id' | while read -r id; do gh api -X DELETE "$api/$id"; done
