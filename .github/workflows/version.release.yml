name: Build and Push Docker Image on Version Release

on:
  push:
    tags:
      - 'v*'  # matches version release only
  workflow_dispatch:  # a dry run: builds both platforms natively, pushes and tags nothing

env:
  IMAGE_NAME: garmin-fetch-data
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  # Each platform builds natively on its own runner (no QEMU) and pushes by digest, with no tag. The amd64 image is then the one the
  # stack, upgrade and browser tests run against, so what is tested is what ships; the merge job tags both only when those pass.
  # Both runners are 26.04; the arm64 one is labelled ubuntu-26.04-arm.
  build:
    name: Build ${{ matrix.platform }}
    if: ${{ github.repository == 'endosome/garmin-grafana' }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build only (dry run)
        if: ${{ github.event_name != 'push' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=release-${{ matrix.runner }}
      - name: Build and push by digest
        if: ${{ github.event_name == 'push' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.runner }}
          cache-to: type=gha,scope=release-${{ matrix.runner }},mode=max
      - name: Record the digest
        if: ${{ github.event_name == 'push' }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'push' }}
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  amd64_image:
    name: The amd64 image to test
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: digests-ubuntu-26.04
          path: digests
      - id: digest
        run: echo "image=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@sha256:$(ls digests)" >> "$GITHUB_OUTPUT"

  tests:
    needs: amd64_image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/tests.yml
    with:
      image: ${{ needs.amd64_image.outputs.image }}

  browser:
    needs: amd64_image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/browser.yml
    with:
      image: ${{ needs.amd64_image.outputs.image }}

  build_and_push:
    name: Publish the multi-arch image to GHCR
    needs: [build, tests, browser]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Create the manifest list and push it
        working-directory: ${{ runner.temp }}/digests
        run: |
          image=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          docker buildx imagetools create -t "$image:${IMAGE_TAG}" $(printf "$image@sha256:%s " *)
      - name: Show the result
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
