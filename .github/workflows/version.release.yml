name: Build and Push Docker Image on Version Release

on:
  push:
    tags:
      - 'v*'  # matches version release only

env:
  IMAGE_NAME: garmin-fetch-data
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  tests:
    if: ${{ github.repository == 'endosome/garmin-grafana' }}
    uses: ./.github/workflows/tests.yml

  build_and_push:
    name: Build Multi-Arch Docker Image and Push to GHCR
    needs: tests
    if: ${{ github.repository == 'endosome/garmin-grafana' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io 
          username: ${{ github.repository_owner}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for Multi-Architecture Support
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Multi-Arch Image (linux/amd64, linux/arm64) and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Build Helm Chart
        run: |
          cd k8s
          helm plugin install https://github.com/melmorabity/helm-kubeconform --version 0.6.4.1
          helm dependency build
          helm kubeconform --skip CustomResourceDefinition --summary .
          helm package . -d helm/charts --version ${{ env.IMAGE_TAG }}-helm
          helm repo index helm/charts --url https://${{ github.repository_owner }}.github.io/garmin-grafana
          helm push helm/charts/garmin-grafana-${{ env.IMAGE_TAG }}-helm.tgz \
              oci://ghcr.io/${{ github.repository_owner }}/