name: Build and Push Docker Image on Version Release

on:
  push:
    tags:
      - 'v*'  # matches version release only

env:
  IMAGE_NAME: garmin-fetch-data
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  tests:
    if: ${{ github.repository == 'endosome/garmin-grafana' }}
    uses: ./.github/workflows/tests.yml

  # Each platform builds natively on its own runner (no QEMU) and pushes by digest; the merge job joins them under the tag.
  # The arm64 runner label is the 24.04 one: the build happens inside the image, so the host OS does not matter.
  build:
    name: Build ${{ matrix.platform }}
    needs: tests
    if: ${{ github.repository == 'endosome/garmin-grafana' }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.runner }}
          cache-to: type=gha,scope=release-${{ matrix.runner }},mode=max
      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build_and_push:
    name: Publish the multi-arch image to GHCR
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Create the manifest list and push it
        working-directory: ${{ runner.temp }}/digests
        run: |
          image=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          docker buildx imagetools create -t "$image:${IMAGE_TAG}" $(printf "$image@sha256:%s " *)
      - name: Show the result
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
