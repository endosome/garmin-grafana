# Serves the touchscreen wrapper page and, on the same origin, the kiosk Grafana under /grafana/.
server {
    listen 80;
    server_name _;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location /grafana/ {
        proxy_pass http://grafana-kiosk:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # Grafana Live uses a websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        return 302 /;
    }
}
