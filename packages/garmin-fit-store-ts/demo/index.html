<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIT store demo</title>
<style>body{font:16px system-ui;margin:2rem auto;max-width:42rem;padding:0 1rem}pre{background:#8881;padding:.75rem;overflow:auto}</style>
<h1>FIT store demo</h1>
<p>Choose a FIT file: it is imported into PGlite with TimescaleDB, in your browser, then exported again for download.</p>
<input id="file" type="file" accept=".fit">
<p><a id="download" hidden>Download the exported file</a></p>
<pre id="log">Loading the database…</pre>
<script type="module">
// Serve this directory (after `node demo/build.mjs`) together with: ./pglite/ (the PGlite ESM build), ./timescaledb/ (the
// fork's @electric-sql/pglite-timescaledb build) and ./migrations/ (packages/garmin-fit-store/src/garmin_fit_store/migrations).
import { PGlite } from './pglite/index.js'
import { timescaledb } from './timescaledb/index.js'
import { importFile, exportFile } from './dist/store.js'

const log = (text) => { document.getElementById('log').textContent += `\n${text}` }
const pg = await PGlite.create({ extensions: { timescaledb } })
for (const name of ['001_schema.sql', '002_functions.sql']) await pg.exec(await (await fetch(`./migrations/${name}`)).text())
document.getElementById('log').textContent = 'Ready.'
document.getElementById('file').addEventListener('change', async (event) => {
  const data = new Uint8Array(await event.target.files[0].arrayBuffer())
  try {
    const id = await importFile(pg, data, false)
    const rows = (await pg.query('SELECT (SELECT count(*) FROM fit.records WHERE file_id = $1)::int AS records, (SELECT count(*) FROM fit.messages WHERE file_id = $1)::int AS others', [id])).rows[0]
    log(`Stored as file ${id}: ${rows.records} records, ${rows.others} other messages.`)
    const link = document.getElementById('download')
    link.href = URL.createObjectURL(new Blob([await exportFile(pg, id)], { type: 'application/octet-stream' }))
    link.download = event.target.files[0].name.replace(/\.fit$/i, '') + '-exported.fit'
    link.hidden = false
  } catch (error) { log(`Could not read the file: ${error.message}`) }
})
</script>
