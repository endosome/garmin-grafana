{{- $name := .Release.Name -}}
{{- range $kind, $size := dict "postgres" .Values.postgresStorage "tokens" .Values.tokenStorage "grafana" .Values.grafanaStorage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-{{ $kind }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if $.Values.storageClass }}
  storageClassName: {{ $.Values.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $size }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-database-env
data:
  PGHOST: {{ printf "%s-postgres" $name | quote }}
  PGPORT: "5432"
  PGDATABASE: {{ .Values.database | quote }}
  PGUSER: {{ .Values.username | quote }}
  PGSSLMODE: disable
  POSTGRES_DB: {{ .Values.database | quote }}
  POSTGRES_USER: {{ .Values.username | quote }}
  ACCOUNT_ID: {{ .Values.account | quote }}
  USER_TIMEZONE: {{ .Values.timezone | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: {{ $name }}-postgres}
  template:
    metadata:
      labels: {app: {{ $name }}-postgres}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresImage | quote }}
          envFrom:
            - configMapRef: {name: {{ $name }}-database-env}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: PGPASSWORD}
            - name: TIMESCALEDB_TELEMETRY
              value: "off"
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data, subPath: data}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ $name }}-postgres}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-postgres
spec:
  selector: {app: {{ $name }}-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-grafana-provisioning
data:
  datasource.yaml: |
{{ .Files.Get "files/postgres.yaml" | indent 4 }}
  provider.yaml: |
{{ .Files.Get "files/provider.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-dashboards
data:
{{- range $path, $_ := .Files.Glob "files/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-grafana
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ $name }}-grafana}
  template:
    metadata:
      labels: {app: {{ $name }}-grafana}
      annotations:
        provisioning-checksum: {{ .Files.Get "files/postgres.yaml" | sha256sum }}
    spec:
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: {{ .Values.grafanaImage | quote }}
          envFrom:
            - configMapRef: {name: {{ $name }}-database-env}
            - secretRef: {name: {{ .Values.existingSecret }}}
          env:
            - {name: PGUSER, value: grafana_reader}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: PGREADER_PASSWORD}
            - {name: GF_PLUGINS_PREINSTALL, value: marcusolsson-hourly-heatmap-panel@2.0.1}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/provider.yaml, subPath: provider.yaml}
            - {name: dashboards, mountPath: /etc/grafana/dashboards}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ $name }}-grafana}
        - name: provisioning
          configMap: {name: {{ $name }}-grafana-provisioning}
        - name: dashboards
          configMap: {name: {{ $name }}-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-grafana
spec:
  selector: {app: {{ $name }}-grafana}
  ports: [{port: 3000, targetPort: 3000}]
