apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-garmin
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}-garmin}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-garmin}
    spec:
      securityContext: {fsGroup: 1000, runAsUser: 1000, runAsGroup: 1000}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgresImage | quote }}
          command: [sh, -c, 'until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do sleep 5; done']
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-database-env}
        - name: migrate
          image: {{ .Values.appImage | quote }}
          command: [python, -m, garmin_grafana.migrate]
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-database-env}
            - secretRef: {name: {{ .Values.existingSecret }}}
      containers:
        - name: garmin
          image: {{ .Values.appImage | quote }}
          securityContext: {allowPrivilegeEscalation: false}
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-database-env}
            - secretRef: {name: {{ .Values.existingSecret }}}
          volumeMounts:
            - {name: tokens, mountPath: /home/appuser/.garminconnect}
      volumes:
        - name: tokens
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-tokens}
