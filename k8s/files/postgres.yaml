apiVersion: 1
datasources:
  - name: Garmin PostgreSQL
    uid: garmin_postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: ${PGHOST}:${PGPORT}
    user: ${PGUSER}
    secureJsonData:
      password: ${PGPASSWORD}
    jsonData:
      database: ${PGDATABASE}
      sslmode: ${PGSSLMODE}
      postgresVersion: 1700
      timescaledb: true
    isDefault: true
    editable: false
