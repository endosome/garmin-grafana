[project]
name = "garmin-grafana"
version = "0.3.0"
description = "A Python application to fetch Garmin health data and populate it in an InfluxDB Database, for visualizing long term health trends with Grafana"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "dotenv==0.9.9",
    "fitparse==1.2.0",
    "garminconnect==0.3.7",
    "influxdb==5.3.2",
    "influxdb3-python==0.12.0",
    "pandas==2.2.3",
]

[project.scripts]
garmin-fetch = "garmin_grafana:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/garmin_grafana"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    # third-party libraries still using deprecated datetime APIs
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:influxdb.*",
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:reactivex.*",
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:fitparse.*",
]

[tool.coverage.run]
source = ["src/garmin_grafana"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 98
