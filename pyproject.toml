[project]
name = "garmin-grafana"
version = "0.11.1"
description = "A Python application to fetch Garmin health data and populate it in PostgreSQL + TimescaleDB, for visualizing long term health trends with Grafana"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "garmin-fit-store",
    "dotenv==0.9.9",
    "garminconnect==0.3.7",
    "psycopg[binary]>=3.2,<4",
    "pytz>=2025.2",
    "requests>=2.32,<3",
]

[project.scripts]
garmin-fetch = "garmin_grafana:main"

[tool.uv.workspace]
members = ["packages/garmin-fit-store"]

[tool.uv.sources]
garmin-fit-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/garmin_grafana"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["grafana: needs the running Compose stack (GRAFANA_URL), see tests/test_grafana_stack.py"]
xfail_strict = true
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["src/garmin_grafana"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 98
