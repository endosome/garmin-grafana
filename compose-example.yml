name: garmin-timescale
x-database-env: &database-env
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: ${PGDATABASE:-garmin}
  PGUSER: ${PGUSER:-garmin}
  PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
  PGSSLMODE: disable

services:
  postgres:
    image: timescale/timescaledb:2.26.4-pg17-oss
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-garmin}
      POSTGRES_USER: ${PGUSER:-garmin}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
  migrate:
    build: .
    image: garmin-grafana:timescale
    command: [python, -m, garmin_grafana.migrate]
    environment:
      <<: *database-env
      PGREADER_PASSWORD: ${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
  garmin-fetch-data:
    build: .
    image: garmin-grafana:timescale
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      <<: *database-env
      ACCOUNT_ID: ${ACCOUNT_ID:-default}
      USER_TIMEZONE: ${USER_TIMEZONE:-UTC}
      GARMINCONNECT_EMAIL: ${GARMINCONNECT_EMAIL:-}
      GARMINCONNECT_BASE64_PASSWORD: ${GARMINCONNECT_BASE64_PASSWORD:-}
      FETCH_SELECTION: ${FETCH_SELECTION:-daily_avg,sleep,steps,heartrate,stress,breathing,hrv,fitness_age,vo2,activity,race_prediction,body_composition,lifestyle}
      MANUAL_START_DATE: ${MANUAL_START_DATE:-}
      MANUAL_END_DATE: ${MANUAL_END_DATE:-}
    volumes:
      - garmin_tokens:/home/appuser/.garminconnect
    depends_on:
      migrate:
        condition: service_completed_successfully
  grafana:
    image: grafana/grafana:13.0.2
    restart: unless-stopped
    environment:
      <<: *database-env
      PGUSER: grafana_reader
      PGPASSWORD: ${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD in .env}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/${GRAFANA_HOME_DASHBOARD:-Garmin-Health-Overview.json}
      GF_PLUGINS_PREINSTALL: marcusolsson-hourly-heatmap-panel@2.0.1
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Grafana_Config/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./Grafana_Datasource:/etc/grafana/provisioning/datasources:ro
      - ./Grafana_Dashboard:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
  garmin_tokens:
  grafana_data:
