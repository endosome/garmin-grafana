# Source: garmin-grafana/templates/garmin-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmin-garmin
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: garmin-garmin}
  template:
    metadata:
      labels: {app: garmin-garmin}
    spec:
      securityContext: {fsGroup: 1000, runAsUser: 1000, runAsGroup: 1000}
      initContainers:
        - name: wait-for-postgres
          image: "timescale/timescaledb:2.26.4-pg17-oss"
          command: [sh, -c, 'until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do sleep 5; done']
          envFrom:
            - configMapRef: {name: garmin-database-env}
        - name: migrate
          image: "garmin-grafana:timescale"
          command: [python, -m, garmin_grafana.migrate]
          envFrom:
            - configMapRef: {name: garmin-database-env}
            - secretRef: {name: garmin-credentials}
      containers:
        - name: garmin
          image: "garmin-grafana:timescale"
          securityContext: {allowPrivilegeEscalation: false}
          envFrom:
            - configMapRef: {name: garmin-database-env}
            - secretRef: {name: garmin-credentials}
          volumeMounts:
            - {name: tokens, mountPath: /home/appuser/.garminconnect}
      volumes:
        - name: tokens
          persistentVolumeClaim: {claimName: garmin-tokens}
