---
# Source: garmin-grafana/templates/stack.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: garmin-database-env
data:
  PGHOST: "garmin-postgres"
  PGPORT: "5432"
  PGDATABASE: "garmin"
  PGUSER: "garmin"
  PGSSLMODE: disable
  POSTGRES_DB: "garmin"
  POSTGRES_USER: "garmin"
  ACCOUNT_ID: "default"
  USER_TIMEZONE: "UTC"
---
# Source: garmin-grafana/templates/stack.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: garmin-grafana-provisioning
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Garmin PostgreSQL
        uid: garmin_postgres
        type: grafana-postgresql-datasource
        access: proxy
        url: ${PGHOST}:${PGPORT}
        user: ${PGUSER}
        secureJsonData:
          password: ${PGPASSWORD}
        jsonData:
          database: ${PGDATABASE}
          sslmode: ${PGSSLMODE}
          postgresVersion: 1700
          timescaledb: true
        isDefault: true
        editable: false

  provider.yaml: |
    apiVersion: 1
    providers:
      - name: Garmin
        type: file
        options:
          path: /etc/grafana/dashboards
---
