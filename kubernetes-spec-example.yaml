apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmin-grafana
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: garmin-grafana}
  template:
    metadata:
      labels: {app: garmin-grafana}
      annotations:
        provisioning-checksum: 5758e42698e7630783063bf0fcbd844e7f73e662e94011b1126fc4e9d371d8ea
    spec:
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: "grafana/grafana:13.0.2"
          envFrom:
            - configMapRef: {name: garmin-database-env}
            - secretRef: {name: garmin-credentials}
          env:
            - {name: PGUSER, value: grafana_reader}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: garmin-credentials, key: PGREADER_PASSWORD}
            - {name: GF_PLUGINS_PREINSTALL, value: marcusolsson-hourly-heatmap-panel@2.0.1}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/provider.yaml, subPath: provider.yaml}
            - {name: dashboards, mountPath: /etc/grafana/dashboards}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: garmin-grafana}
        - name: provisioning
          configMap: {name: garmin-grafana-provisioning}
        - name: dashboards
          configMap: {name: garmin-dashboards}
