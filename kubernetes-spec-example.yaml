# Source: garmin-grafana/templates/stack.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmin-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: garmin-postgres}
  template:
    metadata:
      labels: {app: garmin-postgres}
    spec:
      containers:
        - name: postgres
          image: "timescale/timescaledb:2.26.4-pg17-oss"
          envFrom:
            - configMapRef: {name: garmin-database-env}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: garmin-credentials, key: PGPASSWORD}
            - name: TIMESCALEDB_TELEMETRY
              value: "off"
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data, subPath: data}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: garmin-postgres}
